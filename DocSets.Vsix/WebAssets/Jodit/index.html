<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocSets Jodit</title>
  <link rel="stylesheet" href="jodit.min.css">
  <style>
    html, body, #editor-host { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: "Segoe UI", sans-serif; }
    #editor-host { display: flex; flex-direction: column; }
    #editor { flex: 1 1 auto; min-height: 0; }
    #editor-host > .jodit-container { flex: 1 1 auto; min-height: 0; border: 0; }
    .jodit-container.docsets-toolbar-hidden > .jodit-toolbar__box {
      display: none !important;
    }
    .jodit-workplace { min-height: 0 !important; }
    .jodit-wysiwyg, .jodit-source { box-sizing: border-box; overflow: auto !important; }
    .jodit-wysiwyg a[href] { cursor: pointer; }
    .jodit-wysiwyg .docsets-attachment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 2px;
      padding: 5px 9px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      background: #f5f5f5;
      color: #202020;
      cursor: default;
      user-select: none;
      font: 13px "Segoe UI", sans-serif;
    }
    .jodit-wysiwyg .docsets-attachment-icon { font-size: 22px; }
    .jodit-wysiwyg .docsets-attachment-type {
      min-width: 25px;
      color: #666;
      font-size: 10px;
      font-weight: 700;
    }
    .jodit-wysiwyg .docsets-attachment-name { user-select: text; }
    .jodit-wysiwyg .docsets-attachment-missing { color: #a4262c; }
    .jodit-wysiwyg .docsets-note-tag {
      --docsets-note-tag-color: #605e5c;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .jodit-wysiwyg .docsets-note-tag-icon {
      display: inline-flex;
      width: 1.15em;
      height: 1.15em;
      margin-right: .28em;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      color: var(--docsets-note-tag-color);
      font: 700 1em/1 "Segoe UI Symbol", "Segoe UI Emoji", sans-serif;
      vertical-align: -.08em;
      user-select: none;
    }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-behavior="checkbox"] > .docsets-note-tag-icon,
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-behavior="toggle"] > .docsets-note-tag-icon { cursor: pointer; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="checkbox"] > .docsets-note-tag-icon::before { content: "☐"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="checkbox"][data-docsets-tag-state="completed"] > .docsets-note-tag-icon::before { content: "☑"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="important"] > .docsets-note-tag-icon::before { content: "★"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="question"] > .docsets-note-tag-icon::before { content: "?"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="tag"] > .docsets-note-tag-icon::before { content: "◆"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="definition"] > .docsets-note-tag-icon::before { content: "≡"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="highlight"] > .docsets-note-tag-icon::before { content: "✎"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="contact"] > .docsets-note-tag-icon::before,
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="client-request"] > .docsets-note-tag-icon::before { content: "●"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="address"] > .docsets-note-tag-icon::before { content: "⌂"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="phone"] > .docsets-note-tag-icon::before,
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="callback"] > .docsets-note-tag-icon::before { content: "☎"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="website"] > .docsets-note-tag-icon::before { content: "◎"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="idea"] > .docsets-note-tag-icon::before { content: "☀"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="password"] > .docsets-note-tag-icon::before { content: "⚿"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="critical"] > .docsets-note-tag-icon::before { content: "⚠"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="project-a"] > .docsets-note-tag-icon::before { content: "A"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="project-b"] > .docsets-note-tag-icon::before { content: "B"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="remember"] > .docsets-note-tag-icon::before { content: "●"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="movie"] > .docsets-note-tag-icon::before { content: "▶"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="book"] > .docsets-note-tag-icon::before { content: "▤"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="music"] > .docsets-note-tag-icon::before { content: "♪"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="article"] > .docsets-note-tag-icon::before { content: "▧"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="blog"] > .docsets-note-tag-icon::before { content: "✎"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="discuss"] > .docsets-note-tag-icon::before { content: "◉"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="email"] > .docsets-note-tag-icon::before { content: "✉"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="meeting"] > .docsets-note-tag-icon::before { content: "▦"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="priority-1"] > .docsets-note-tag-icon::before { content: "1"; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-icon="priority-2"] > .docsets-note-tag-icon::before { content: "2"; }
    /* Icons are real text nodes. This override also prevents a duplicated legacy pseudo-icon. */
    .jodit-wysiwyg .docsets-note-tag > .docsets-note-tag-icon::before { content: none !important; }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-state="completed"] > .docsets-note-tag-content {
      opacity: .72;
      text-decoration: line-through;
    }
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-state="disabled"] > .docsets-note-tag-icon,
    .jodit-wysiwyg .docsets-note-tag[data-docsets-tag-state="disabled"] > .docsets-note-tag-content { opacity: .5; }
    .jodit-wysiwyg .docsets-onenote-diagnostic {
      margin: 5px 0;
      padding: 8px 10px;
      border: 1px solid #d83b01;
      border-left-width: 4px;
      border-radius: 3px;
      background: #fff4ce;
      color: #5c2d00;
      font: 13px "Segoe UI", sans-serif;
    }
    .jodit-wysiwyg .docsets-pasted-plain { white-space: pre-wrap; }
    .docsets-code-language {
      display: inline-flex;
      align-items: center;
      padding: 2px 3px;
    }
    .docsets-code-language select {
      box-sizing: border-box;
      max-width: 112px;
      height: 28px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: inherit;
      font: 12px "Segoe UI", sans-serif;
      cursor: pointer;
    }
    .docsets-code-language select:hover,
    .docsets-code-language select:focus {
      border-color: #999;
      outline: none;
    }
    .docsets-note-tags-menu {
      position: fixed;
      z-index: 2147483647;
      min-width: 190px;
      max-height: 340px;
      overflow: auto;
      padding: 4px;
      border: 1px solid #999;
      border-radius: 4px;
      background: #fff;
      color: #202020;
      box-shadow: 0 3px 12px rgba(0,0,0,.22);
      font: 13px "Segoe UI", sans-serif;
    }
    .docsets-note-tags-menu label {
      display: grid;
      grid-template-columns: 20px 22px 1fr;
      align-items: center;
      min-height: 28px;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
    }
    .docsets-note-tags-menu label:hover { background: #e5f1fb; }
    .docsets-note-tags-menu input { margin: 0; pointer-events: none; }
    .docsets-note-tags-menu-icon { text-align: center; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .docsets-note-tags-menu { background: #252526; color: #f1f1f1; border-color: #666; }
      .docsets-note-tags-menu label:hover { background: #094771; }
    }
    .jodit-wysiwyg pre.docsets-code-block {
      position: relative;
      overflow: auto;
      padding: 22px 12px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 3px;
      background: #f6f8fa;
      font-family: Consolas, "Courier New", monospace;
      white-space: pre;
    }
    .jodit-wysiwyg pre.docsets-code-block::before {
      content: attr(data-language);
      position: absolute;
      top: 3px;
      right: 7px;
      color: #666;
      font: 11px "Segoe UI", sans-serif;
      text-transform: uppercase;
    }
    ::highlight(docsets-code-comment) { color: #008000; }
    ::highlight(docsets-code-prolog),
    ::highlight(docsets-code-doctype),
    ::highlight(docsets-code-cdata) { color: #808080; }
    ::highlight(docsets-code-punctuation) { color: #303030; }
    ::highlight(docsets-code-property),
    ::highlight(docsets-code-tag),
    ::highlight(docsets-code-boolean),
    ::highlight(docsets-code-number),
    ::highlight(docsets-code-constant),
    ::highlight(docsets-code-symbol),
    ::highlight(docsets-code-deleted) { color: #098658; }
    ::highlight(docsets-code-selector),
    ::highlight(docsets-code-attr-name),
    ::highlight(docsets-code-string),
    ::highlight(docsets-code-char),
    ::highlight(docsets-code-builtin),
    ::highlight(docsets-code-inserted) { color: #a31515; }
    ::highlight(docsets-code-operator),
    ::highlight(docsets-code-entity),
    ::highlight(docsets-code-url) { color: #303030; }
    ::highlight(docsets-code-atrule),
    ::highlight(docsets-code-attr-value),
    ::highlight(docsets-code-keyword) { color: #0000ff; }
    ::highlight(docsets-code-function),
    ::highlight(docsets-code-class-name) { color: #795e26; }
    ::highlight(docsets-code-regex),
    ::highlight(docsets-code-important),
    ::highlight(docsets-code-variable) { color: #811f3f; }
    .docsets-image-pending { color: #666; background: #eee; padding: 2px 6px; }
    .docsets-paste-options {
      position: fixed;
      z-index: 2147483647;
      display: flex;
      gap: 2px;
      padding: 4px;
      border: 1px solid #999;
      border-radius: 3px;
      background: #fff;
      color: #222;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
      font: 13px "Segoe UI", sans-serif;
    }
    .docsets-paste-options button {
      padding: 5px 9px;
      border: 1px solid transparent;
      background: transparent;
      color: inherit;
      white-space: nowrap;
      cursor: pointer;
    }
    .docsets-paste-options button:hover,
    .docsets-paste-options button:focus {
      border-color: #0078d4;
      background: #e5f1fb;
      outline: none;
    }
    #status { padding: 18px; color: #666; }
  </style>
</head>
<body>
  <div id="editor-host">
    <div id="status">Инициализация Jodit…</div>
    <textarea id="editor"></textarea>
  </div>
  <script src="jodit.min.js"></script>
  <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>
  <script src="prism.js"></script>
  <script src="prism-csharp.min.js"></script>
  <script src="prism-typescript.min.js"></script>
  <script src="prism-json.min.js"></script>
  <script src="prism-sql.min.js"></script>
  <script src="prism-python.min.js"></script>
  <script src="prism-powershell.min.js"></script>
  <script src="prism-bash.min.js"></script>
  <script src="jodit-editor.js"></script>
</body>
</html>
